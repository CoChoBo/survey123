<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>건강 점수 관리자</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}

.container {
  max-width: 800px;
  margin: auto;
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2 {
  text-align:center;
  margin-bottom:20px;
}

.section {
  margin-top:25px;
}

label {
  font-weight:bold;
}

input {
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  margin-top:10px;
  padding:12px;
  width:100%;
  background:#0068ff;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
}

button.secondary {
  background:#444;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th, td {
  border-bottom:1px solid #ddd;
  padding:8px;
  text-align:center;
}

th {
  background:#f2f2f2;
}

.chart-box {
  margin-top:20px;
}

ul {
  padding-left:20px;
}
</style>
</head>

<body>
<div class="container">

<h2>📊 건강 점수 관리자 대시보드</h2>

<!-- 이름 검색 -->
<div class="section">
  <label>이름 검색</label>
  <input id="nameInput" placeholder="이름 입력">
  <button onclick="searchName()">검색</button>

  <table>
    <thead>
      <tr>
        <th>날짜</th>
        <th>총점</th>
        <th>흡연</th>
        <th>걸음수</th>
        <th>LDL</th>
        <th>혈압</th>
        <th>BMI</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>

  <button class="secondary" onclick="drawChart()">📈 시각화 (최근 4개)</button>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>
</div>

<hr>

<!-- 최근 3일 -->
<div class="section">
  <h3>🕒 최근 3일 설문한 사람</h3>
  <button onclick="loadRecent()">불러오기</button>
  <ul id="recentList"></ul>
</div>

<hr>

<!-- 스프레드시트 -->
<div class="section">
  <button class="secondary" onclick="openSheet()">📄 Google 스프레드시트 열기</button>
</div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyf_z66f3vTiMSSuLwTOgbRCrayt8OIqDR6N9nPoRoyldGVQF2ZlBxb_iUBF_kYts1Q/exec"; // ★ 반드시 수정
let currentData = [];
let chart;

/* 이름 검색 */
async function searchName(){
  const name = document.getElementById("nameInput").value.trim();
  if(!name) return alert("이름 입력");

  const res = await fetch(`${SCRIPT_URL}?mode=search_name&name=${encodeURIComponent(name)}`);
  const json = await res.json();

  currentData = json.data || [];

  const tbody = document.getElementById("resultBody");
  tbody.innerHTML = "";

  if(currentData.length === 0){
    tbody.innerHTML = `<tr><td colspan="7">데이터 없음</td></tr>`;
    return;
  }

  currentData.forEach(r=>{
    tbody.innerHTML += `
      <tr>
        <td>${r.date}</td>
        <td><b>${r.totalScore}</b></td>
        <td>${r.smoking}</td>
        <td>${r.steps}</td>
        <td>${r.ldl}</td>
        <td>${r.bp}</td>
        <td>${r.bmi}</td>
      </tr>
    `;
  });
}

/* 차트 */
function drawChart(){
  if(currentData.length === 0) return alert("먼저 이름 검색");

  const sliced = currentData.slice(-4);
  const labels = sliced.map(r => r.date.slice(5,10).replace("-", "/"));
  const scores = sliced.map(r => r.totalScore);

  const ctx = document.getElementById("chart").getContext("2d");
  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    type:"line",
    data:{
      labels,
      datasets:[{
        label:"총점",
        data:scores,
        borderWidth:2,
        borderColor:"#0068ff",
        tension:0.2
      }]
    }
  });
}

/* 최근 3일 */
async function loadRecent(){
  const res = await fetch(`${SCRIPT_URL}?mode=recent_3days`);
  const json = await res.json();

  const ul = document.getElementById("recentList");
  ul.innerHTML = "";

  json.data.forEach(n=>{
    ul.innerHTML += `<li>${n}</li>`;
  });
}

/* 시트 열기 */
async function openSheet(){
  const res = await fetch(`${SCRIPT_URL}?mode=sheet_url`);
  const json = await res.json();
  window.open(json.url, "_blank");
}
</script>

</body>
</html>
