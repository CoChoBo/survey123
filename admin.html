<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>건강 점수 관리자</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial, sans-serif; background:#f4f6f8; padding:20px; }
.container { max-width: 1050px; margin:auto; background:#fff; border-radius:12px; padding:20px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
h2 { text-align:center; margin-bottom:20px; }
.section { margin-top:26px; }
.section h3 { margin-bottom:10px; }
input { width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; margin-top:6px; }
button { width:100%; padding:12px; margin-top:10px; background:#0068ff; color:#fff; border:none; border-radius:10px; font-size:15px; cursor:pointer; }
button.secondary { background:#444; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border-bottom:1px solid #ddd; padding:8px; text-align:center; }
th { background:#f2f2f2; }
.chart-box { margin-top:20px; }
.grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.small { font-size:13px; color:#555; }
ul { padding-left:20px; }
</style>
</head>

<body>
<div class="container">
  <h2>건강 점수 관리자 대시보드</h2>

  <div class="section">
    <h3>관리자 인증</h3>
    <input id="adminKeyInput" placeholder="관리자 키 입력">
    <button onclick="saveKey()">키 저장</button>
    <div class="small">관리자 기능은 키가 있어야 동작합니다.</div>
  </div>

  <hr>

  <div class="section">
    <h3>참여자별 설문 날짜 수</h3>
    <button onclick="loadNameSummary()">참여도 불러오기</button>
    <table>
      <thead><tr><th>이름</th><th>설문한 날짜 수</th></tr></thead>
      <tbody id="summaryBody"></tbody>
    </table>
  </div>

  <hr>

  <div class="section">
    <h3>이름 검색 (날짜별 최고 점수)</h3>
    <input id="nameInput" placeholder="이름 입력(정확히 일치)">
    <button onclick="searchName()">검색</button>

    <table>
      <thead>
        <tr>
          <th>날짜</th><th>총점</th><th>흡연</th><th>걸음수</th><th>LDL</th>
          <th>수축기</th><th>이완기</th><th>혈압(레거시)</th><th>BMI</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>

    <button class="secondary" onclick="drawChart()">시각화 (최근 4개)</button>
    <div class="chart-box"><canvas id="chart"></canvas></div>
  </div>

  <hr>

  <div class="section">
    <h3>최근 3일 설문한 사람</h3>
    <button onclick="loadRecent()">불러오기</button>
    <ul id="recentList"></ul>
  </div>

  <hr>

  <div class="section">
    <h3>기간 내 설문 기록 열람</h3>
    <div class="grid2">
      <div>
        <div class="small">시작일 (YYYY-MM-DD)</div>
        <input id="startDate" placeholder="예: 2026-01-01">
      </div>
      <div>
        <div class="small">종료일 (YYYY-MM-DD)</div>
        <input id="endDate" placeholder="예: 2026-01-26">
      </div>
    </div>
    <div class="small" style="margin-top:10px;">(선택) 이름 필터</div>
    <input id="rangeName" placeholder="비우면 전체">
    <button onclick="rangeQuery()">기간 조회</button>

    <table>
      <thead>
        <tr>
          <th>날짜</th><th>이름</th><th>총점</th><th>흡연</th><th>걸음수</th><th>LDL</th>
          <th>수축기</th><th>이완기</th><th>혈압(레거시)</th><th>BMI</th>
        </tr>
      </thead>
      <tbody id="rangeBody"></tbody>
    </table>
  </div>

  <hr>

  <div class="section">
    <button class="secondary" onclick="openSheet()">Google 스프레드시트 열기</button>
  </div>
</div>

<script>
const SCRIPT_URL = "YOUR_APPS_SCRIPT_WEBAPP_URL"; // ★ 교체

let currentData = [];
let chart;

function saveKey(){
  const k = document.getElementById("adminKeyInput").value.trim();
  if(!k) return alert("키를 입력하세요");
  sessionStorage.setItem("ADMIN_KEY", k);
  alert("키 저장 완료");
}

function getKey(){
  const k = sessionStorage.getItem("ADMIN_KEY") || "";
  if(!k){
    alert("관리자 키를 먼저 저장하세요.");
    throw new Error("no key");
  }
  return k;
}

async function loadNameSummary(){
  const key = encodeURIComponent(getKey());
  const res = await fetch(`${SCRIPT_URL}?mode=name_summary&key=${key}`);
  const json = await res.json();

  const tbody = document.getElementById("summaryBody");
  tbody.innerHTML = "";

  if(json.status !== "ok"){
    tbody.innerHTML = `<tr><td colspan="2">오류: ${json.message || "unknown"}</td></tr>`;
    return;
  }

  (json.data || []).forEach(r=>{
    tbody.innerHTML += `<tr><td>${r.name}</td><td><b>${r.count}</b></td></tr>`;
  });
}

async function searchName(){
  const name = document.getElementById("nameInput").value.trim();
  if(!name) return alert("이름을 입력하세요");

  const key = encodeURIComponent(getKey());
  const res = await fetch(`${SCRIPT_URL}?mode=search_name&name=${encodeURIComponent(name)}&key=${key}`);
  const json = await res.json();

  currentData = json.data || [];

  const tbody = document.getElementById("resultBody");
  tbody.innerHTML = "";

  if(json.status !== "ok"){
    tbody.innerHTML = `<tr><td colspan="9">오류: ${json.message || "unknown"}</td></tr>`;
    return;
  }

  if(currentData.length === 0){
    tbody.innerHTML = `<tr><td colspan="9">데이터 없음</td></tr>`;
    return;
  }

  currentData.forEach(r=>{
    tbody.innerHTML += `
      <tr>
        <td>${r.date}</td>
        <td><b>${r.totalScore}</b></td>
        <td>${r.smoking}</td>
        <td>${r.steps}</td>
        <td>${r.ldl}</td>
        <td>${(r.sbp === "" ? "-" : r.sbp)}</td>
        <td>${(r.dbp === "" ? "-" : r.dbp)}</td>
        <td>${(r.bpLegacy === "" ? "-" : r.bpLegacy)}</td>
        <td>${r.bmi}</td>
      </tr>
    `;
  });
}

function drawChart(){
  if(currentData.length === 0){
    alert("먼저 이름 검색을 하세요");
    return;
  }

  const sliced = currentData.slice(-4);
  const labels = sliced.map(r => String(r.date).slice(5,10).replace("-", "/"));
  const scores = sliced.map(r => Number(r.totalScore));

  const ctx = document.getElementById("chart").getContext("2d");
  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    type:"line",
    data:{ labels, datasets:[{ label:"총점", data:scores, borderWidth:2, borderColor:"#0068ff", tension:0.2 }] }
  });
}

async function loadRecent(){
  const key = encodeURIComponent(getKey());
  const res = await fetch(`${SCRIPT_URL}?mode=recent_3days&key=${key}`);
  const json = await res.json();

  const ul = document.getElementById("recentList");
  ul.innerHTML = "";

  if(json.status !== "ok"){
    ul.innerHTML = `<li>오류: ${json.message || "unknown"}</li>`;
    return;
  }

  (json.data || []).forEach(n => ul.innerHTML += `<li>${n}</li>`);
}

async function rangeQuery(){
  const start = document.getElementById("startDate").value.trim();
  const end = document.getElementById("endDate").value.trim();
  const name = document.getElementById("rangeName").value.trim();

  if(!start || !end) return alert("시작일/종료일을 입력하세요 (YYYY-MM-DD)");

  const key = encodeURIComponent(getKey());
  const url =
    `${SCRIPT_URL}?mode=range_query&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`
    + (name ? `&name=${encodeURIComponent(name)}` : ``)
    + `&key=${key}`;

  const res = await fetch(url);
  const json = await res.json();

  const tbody = document.getElementById("rangeBody");
  tbody.innerHTML = "";

  if(json.status !== "ok"){
    tbody.innerHTML = `<tr><td colspan="10">오류: ${json.message || "unknown"}</td></tr>`;
    return;
  }

  const data = json.data || [];
  if(data.length === 0){
    tbody.innerHTML = `<tr><td colspan="10">데이터 없음</td></tr>`;
    return;
  }

  data.forEach(r=>{
    tbody.innerHTML += `
      <tr>
        <td>${r.date}</td><td>${r.name}</td><td><b>${r.totalScore}</b></td>
        <td>${r.smoking}</td><td>${r.steps}</td><td>${r.ldl}</td>
        <td>${(r.sbp === "" ? "-" : r.sbp)}</td>
        <td>${(r.dbp === "" ? "-" : r.dbp)}</td>
        <td>${(r.bpLegacy === "" ? "-" : r.bpLegacy)}</td>
        <td>${r.bmi}</td>
      </tr>
    `;
  });
}

async function openSheet(){
  const key = encodeURIComponent(getKey());
  const res = await fetch(`${SCRIPT_URL}?mode=sheet_url&key=${key}`);
  const json = await res.json();
  if(json.status !== "ok") return alert(`오류: ${json.message || "unknown"}`);
  window.open(json.url, "_blank");
}
</script>
</body>
</html>
